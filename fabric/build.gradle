plugins {
    id 'com.github.johnrengelman.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

repositories {
    mavenCentral()
    maven {
        name = "Modrinth"
        url = uri("https://api.modrinth.com/maven")
        content {
            includeGroup("maven.modrinth")
        }
    }
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    modImplementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"
    modImplementation "maven.modrinth:sodium:$rootProject.sodium_version"
    modLocalRuntime "maven.modrinth:iris:$rootProject.iris_version"
    modLocalRuntime "maven.modrinth:indium:$rootProject.indium_version"

    modImplementation "dev.architectury:architectury-fabric:$rootProject.architectury_api_version"
    if (findProject(":krakkFabric") != null) {
        // Keep local Krakk Fabric on runtime classpath without forcing Loom to remap/read its dev jar during configuration.
        runtimeOnly(project(path: ":krakkFabric", configuration: "namedElements")) { transitive false }
        // Krakk common mixin classes live in the transformed common output, not in the thin namedElements jar.
        implementation(project(path: ":krakkCommon", configuration: "transformProductionFabric")) { transitive false }
    } else {
        modImplementation("${rootProject.krakk_group}:krakk-fabric:${rootProject.krakk_version}") { transitive false }
    }

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')

    // Valkyrien Skies 2 — present in dev runs but not required at runtime for end users.
    def vs2Version = findProperty("vs2_version") ?: "2.4.10"
    modLocalRuntime("org.valkyrienskies:valkyrienskies-120-fabric:${vs2Version}") {
        exclude group: "com.simibubi"
        exclude group: "io.github.fabricators_of_create"
        exclude group: "dev.engine-room"
        exclude group: "dev.engine_room"
        exclude group: "maven.modrinth", module: "sodium"
    }
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}

jar {
    archiveClassifier = 'dev'
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    dependsOn shadowJar
    inputFile.set shadowJar.archiveFile
    // Keep inherited Jar copy actions ahead of remap actions.
    // This avoids manifest-only copy actions overwriting remapped outputs.
    try {
        def methodField = Class.forName("org.gradle.api.internal.project.taskfactory.StandardTaskAction")
                .getDeclaredField("method")
        methodField.setAccessible(true)

        def copyActions = new ArrayList<>()
        def otherActions = new ArrayList<>()
        for (def action : new ArrayList<>(actions)) {
            boolean isCopy = false
            try {
                def method = methodField.get(action)
                isCopy = method?.name == "copy"
            } catch (Throwable ignored) {
            }
            if (isCopy) {
                copyActions.add(action)
            } else {
                otherActions.add(action)
            }
        }
        setActions(copyActions + otherActions)
    } catch (Throwable ignored) {
        // Internal Gradle task-action implementation changed; keep default order.
    }
}
