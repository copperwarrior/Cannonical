plugins {
    id 'com.github.johnrengelman.shadow'
}

loom {
    forge {
        mixinConfig "cannonical.mixins.json"
    }
}

architectury {
    platformSetupLoomIde()
    forge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    forge "net.minecraftforge:forge:$rootProject.forge_version"

    modImplementation "dev.architectury:architectury-forge:$rootProject.architectury_api_version"
    if (findProject(":krakkForge") != null) {
        runtimeOnly(project(path: ":krakkForge", configuration: "namedElements")) { transitive false }
        implementation(project(path: ":krakkCommon", configuration: "transformProductionForge")) { transitive false }
    } else {
        modImplementation("${rootProject.krakk_group}:krakk-forge:${rootProject.krakk_version}") { transitive false }
    }

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionForge')

    // Valkyrien Skies 2 — present in dev runs but not required at runtime for end users.
    def vs2Version = findProperty("vs2_version") ?: "2.4.10"
    modLocalRuntime("org.valkyrienskies:valkyrienskies-120-forge:${vs2Version}") { transitive = false }
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/mods.toml') {
        expand version: project.version
    }
}

jar {
    archiveClassifier = 'dev'
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    dependsOn shadowJar
    inputFile.set shadowJar.archiveFile
    // Keep inherited Jar copy actions ahead of remap actions.
    // This avoids manifest-only copy actions overwriting remapped outputs.
    try {
        def methodField = Class.forName("org.gradle.api.internal.project.taskfactory.StandardTaskAction")
                .getDeclaredField("method")
        methodField.setAccessible(true)

        def copyActions = new ArrayList<>()
        def otherActions = new ArrayList<>()
        for (def action : new ArrayList<>(actions)) {
            boolean isCopy = false
            try {
                def method = methodField.get(action)
                isCopy = method?.name == "copy"
            } catch (Throwable ignored) {
            }
            if (isCopy) {
                copyActions.add(action)
            } else {
                otherActions.add(action)
            }
        }
        setActions(copyActions + otherActions)
    } catch (Throwable ignored) {
        // Internal Gradle task-action implementation changed; keep default order.
    }
}
